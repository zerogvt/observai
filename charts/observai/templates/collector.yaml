{{- if .Values.otel.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observai.collector.fullname" . }}-config
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: {{ .Values.collector.memoryLimiterMiB }}
        spike_limit_mib: 100
      batch:
        timeout: 5s
        send_batch_size: 1024
      cumulativetodelta: {}

    exporters:
      otlphttp/dynatrace:
        endpoint: ${env:DT_OTLP_ENDPOINT}
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/dynatrace, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, cumulativetodelta, batch]
          exporters: [otlphttp/dynatrace, debug]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observai.collector.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observai.collector.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "observai.commonLabels" . | nindent 8 }}
        app.kubernetes.io/name: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collector
      annotations:
        # Roll pods when the config changes (a mounted ConfigMap change alone
        # does not restart the collector process).
        checksum/config: {{ .Values.collector.memoryLimiterMiB | toString | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "{{ .Values.images.collector.repository }}:{{ .Values.images.collector.tag }}"
          imagePullPolicy: {{ .Values.images.collector.pullPolicy }}
          args: ["--config=/etc/otel/config.yaml"]
          envFrom:
            - secretRef:
                name: {{ include "observai.dynatrace.secretName" . }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "observai.collector.fullname" . }}-config
{{- end }}

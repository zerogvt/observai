{{- if and .Values.otel.enabled .Values.dynatrace.createSecret }}
# Created only when dynatrace.createSecret=true. Prefer passing values with
# --set at install time rather than committing them:
#   helm install ... --set dynatrace.createSecret=true \
#     --set dynatrace.endpoint=... --set dynatrace.apiToken=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observai.dynatrace.secretName" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
type: Opaque
stringData:
  DT_OTLP_ENDPOINT: {{ required "dynatrace.endpoint is required when createSecret=true" .Values.dynatrace.endpoint | quote }}
  DT_API_TOKEN: {{ required "dynatrace.apiToken is required when createSecret=true" .Values.dynatrace.apiToken | quote }}
{{- end }}

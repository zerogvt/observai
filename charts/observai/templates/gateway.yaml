apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observai.gateway.fullname" . }}-config
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
data:
  SERVICE_NAME: "gateway"
  ENV: "production"
  PORT: {{ .Values.gateway.service.port | quote }}
  WEB_CONCURRENCY: {{ .Values.gateway.webConcurrency | quote }}
  GUNICORN_TIMEOUT: {{ .Values.gateway.gunicornTimeout | quote }}
  INFERENCE_URL: {{ printf "http://%s:%d/infer" (include "observai.inference.fullname" .) (int .Values.inference.service.port) | quote }}
  INFERENCE_TIMEOUT_S: {{ .Values.gateway.inferenceTimeoutS | quote }}
  OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s:4318" (include "observai.collector.fullname" .) | quote }}
  RATE_LIMIT_DEFAULT: {{ .Values.gateway.rateLimit.default | quote }}
  RATE_LIMIT_PROMPT: {{ .Values.gateway.rateLimit.prompt | quote }}
  {{- if .Values.redis.enabled }}
  RATE_LIMIT_STORAGE_URI: {{ printf "redis://%s:%d/0" (include "observai.redis.fullname" .) (int .Values.redis.service.port) | quote }}
  {{- else }}
  RATE_LIMIT_STORAGE_URI: "memory://"
  {{- end }}
  MAX_INPUT_CHARS: {{ .Values.gateway.maxInputChars | quote }}
  ALLOWED_TASKS: {{ .Values.gateway.allowedTasks | quote }}
  OVERSIGHT_CONFIDENCE_FLOOR: {{ .Values.gateway.oversightConfidenceFloor | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observai.gateway.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observai.gateway.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "observai.commonLabels" . | nindent 8 }}
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "observai.gateway.fullname" . }}-config
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

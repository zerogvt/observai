{{- $ollamaUrl := .Values.inference.ollamaUrl | default (printf "http://%s:%d" (include "observai.ollama.fullname" .) (int .Values.ollama.service.port)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observai.inference.fullname" . }}-config
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: inference
    app.kubernetes.io/component: inference
data:
  SERVICE_NAME: "inference"
  ENV: "production"
  PORT: {{ .Values.inference.service.port | quote }}
  WEB_CONCURRENCY: {{ .Values.inference.webConcurrency | quote }}
  GUNICORN_TIMEOUT: {{ .Values.inference.gunicornTimeout | quote }}
  OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s:4318" (include "observai.collector.fullname" .) | quote }}
  OLLAMA_URL: {{ $ollamaUrl | quote }}
  OLLAMA_MODEL: {{ .Values.ollama.model | quote }}
  OLLAMA_TIMEOUT_S: {{ .Values.inference.ollamaTimeoutS | quote }}
  MAX_OUTPUT_TOKENS: {{ .Values.inference.maxOutputTokens | quote }}
  TEMPERATURE: {{ .Values.inference.temperature | quote }}
  CONFIDENCE_REVIEW_FLOOR: {{ .Values.inference.confidenceReviewFloor | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observai.inference.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: inference
    app.kubernetes.io/component: inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: {{ .Values.inference.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observai.inference.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: inference
    app.kubernetes.io/component: inference
spec:
  replicas: {{ .Values.inference.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: inference
  template:
    metadata:
      labels:
        {{- include "observai.commonLabels" . | nindent 8 }}
        app.kubernetes.io/name: inference
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: inference
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference
          image: "{{ .Values.images.inference.repository }}:{{ .Values.images.inference.tag }}"
          imagePullPolicy: {{ .Values.images.inference.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.inference.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "observai.inference.fullname" . }}-config
          resources:
            {{- toYaml .Values.inference.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "observai.ollama.fullname" . }}-models
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: llm-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
  {{- if .Values.ollama.persistence.storageClass }}
  storageClassName: {{ .Values.ollama.persistence.storageClass }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observai.ollama.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: llm-backend
spec:
  replicas: 1
  # ReadWriteOnce PVC: only one pod may mount it, so tear the old pod down
  # before creating the new one during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: llm-backend
  template:
    metadata:
      labels:
        {{- include "observai.commonLabels" . | nindent 8 }}
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: llm-backend
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Pull the model into the shared volume before serving. Idempotent: a
        # no-op if the model is already present.
        - name: pull-model
          image: "{{ .Values.images.ollama.repository }}:{{ .Values.images.ollama.tag }}"
          imagePullPolicy: {{ .Values.images.ollama.pullPolicy }}
          env:
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              pid=$!
              echo "waiting for the ollama daemon..."
              until ollama list >/dev/null 2>&1; do sleep 1; done
              echo "pulling {{ .Values.ollama.model }} (no-op if already present)..."
              ollama pull {{ .Values.ollama.model }}
              echo "pull complete"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ollama
          image: "{{ .Values.images.ollama.repository }}:{{ .Values.images.ollama.tag }}"
          imagePullPolicy: {{ .Values.images.ollama.pullPolicy }}
          env:
            # Must be 0.0.0.0 or Ollama binds to localhost only and the Service
            # can't reach it.
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          ports:
            - name: http
              containerPort: 11434
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "observai.ollama.fullname" . }}-models
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observai.ollama.fullname" . }}
  labels:
    {{- include "observai.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: llm-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: llm-backend
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}

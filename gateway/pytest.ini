[pytest]
# Put the gateway/ dir (rootdir, where this file lives) on sys.path so tests
# can `import app`, `import validation`, etc. from the tests/ subfolder.
# Works with plain `pytest` and with `python -m pytest`.
pythonpath = .
# Where the tests live. Rename this if you rename the folder.
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning

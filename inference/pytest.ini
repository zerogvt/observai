[pytest]
# Put the inference/ dir (the rootdir, where this file lives) on sys.path so
# the tests can `import app`, `import provider`, etc. from their subfolder.
# With this, plain `pytest` works as well as `python -m pytest`.
pythonpath = .
# Where the tests live. Rename this if you rename the folder.
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
